<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MazenOS — Settings</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <header class="os-header">
    <div class="os-brand">
      <a href="index.html" class="os-back-link" id="settingsBackLink">&larr; Back</a>
      <span>Settings</span>
    </div>
  </header>

  <main class="os-container">
    <!-- Top Section: Tool Settings -->
    <section class="card" style="margin-bottom:1.5rem;">
      <div class="card-header">
        <div>
          <h1 class="card-title" id="contextSectionTitle">Tool Settings</h1>
          <p class="card-subtitle" id="contextSectionSubtitle">Preferences for the tool you came from</p>
        </div>
        <select id="contextModuleSelector" style="width:auto;">
          <option value="dashboard">Dashboard &amp; Daily Breaks</option>
          <option value="taskitator">Taskitator</option>
          <option value="budget">Budget</option>
          <option value="blocker">Blocker &amp; Confinement</option>
          <option value="curry">Study Assistant</option>
          <option value="health">Sleep &amp; Health</option>
          <option value="diary">Diary</option>
          <option value="leisure">Leisure Hub</option>
        </select>
      </div>

      <form id="contextualSettingsForm">
        <div id="contextualFieldsContainer"></div>
        <button type="submit" class="btn btn-secondary">Save Tool Settings</button>
      </form>
    </section>

    <!-- Bottom Section: AI & Phone Connection -->
    <section class="card">
      <div class="card-header">
        <div>
          <h2 class="card-title">AI &amp; Phone Connection</h2>
          <p class="card-subtitle">API keys and your generated MacroDroid phone token</p>
        </div>
      </div>

      <form id="universalSettingsForm">
        <div class="form-row">
          <div class="form-group">
            <label for="aiProviderSelect">AI Provider</label>
            <select id="aiProviderSelect">
              <option value="gemini">Google Gemini</option>
              <option value="claude">Anthropic Claude</option>
            </select>
          </div>
          <div class="form-group">
            <label for="modelTierSelect">Model Speed</label>
            <select id="modelTierSelect">
              <option value="light">Fast (Everyday tasks &amp; chat)</option>
              <option value="smart">Detailed (Photo proof checks &amp; deep reasoning)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="geminiKeyInput">Gemini API Key</label>
            <input type="password" id="geminiKeyInput" placeholder="AIzaSy...">
          </div>
          <div class="form-group">
            <label for="claudeKeyInput">Claude API Key</label>
            <input type="password" id="claudeKeyInput" placeholder="sk-ant-...">
          </div>
        </div>

        <div class="form-group">
          <label for="macrodroidTokenInput">MacroDroid Phone Token (Generated by MazenOS — copy this into MacroDroid)</label>
          <div class="token-box-row">
            <input type="text" id="macrodroidTokenInput" readonly>
            <button type="button" class="btn btn-secondary" id="copyMacrodroidTokenBtn">Copy</button>
            <button type="button" class="btn btn-secondary" id="regenMacrodroidTokenBtn">Generate New</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Save Settings</button>
      </form>
    </section>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="settings.js"></script>
</body>
</html>
